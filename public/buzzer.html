<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz Buzzer</title>
  <style>
    *{touch-action:manipulation;box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10131a;color:white;font-family:Arial,sans-serif}
    #setup{height:100%;display:grid;place-content:center;padding:24px;text-align:center}
    #setup h1{font-size:2.2rem}#setup input,#setup select{width:min(88vw,420px);font-size:1.3rem;padding:14px;margin:7px;border-radius:10px;border:0}
    #setup button{width:min(88vw,420px);font-size:1.5rem;padding:16px;margin:7px;border-radius:12px;border:0;background:#2563eb;color:white;font-weight:900}
    #buzzView{display:none;height:100%;grid-template-rows:auto 1fr auto}
    #status{font-size:clamp(1.6rem,7vw,3rem);text-align:center;font-weight:900;padding:16px 8px}
    #buzzButton{width:calc(100% - 24px);height:auto;margin:12px;border:0;border-radius:28px;background:#dc2626;color:white;font-size:clamp(3.5rem,18vw,8rem);font-weight:900;box-shadow:0 10px 30px #000}
    #teamInfo{text-align:center;font-size:1.2rem;padding:10px}
    #micStatus{min-height:50px;text-align:center;font-size:1.4rem;font-weight:900;padding:8px;color:#94a3b8}
    #micStatus.live{color:#ef4444}#micStatus.blocked{color:#f97316}
    #pttButton{display:none;width:calc(100% - 24px);min-height:100px;margin:12px;border:0;border-radius:18px;background:#16a34a;color:white;font-size:2rem;font-weight:900}
  </style>
</head>
<body>
  <div id="setup">
    <h1>Join the Quiz</h1>
    <select id="teamNumber" aria-label="Team number">
      <option value="">Pick team number</option>
      <option value="1">Team 1</option><option value="2">Team 2</option><option value="3">Team 3</option><option value="4">Team 4</option>
      <option value="5">Team 5</option><option value="6">Team 6</option><option value="7">Team 7</option><option value="8">Team 8</option>
      <option value="9">Team 9</option><option value="10">Team 10</option><option value="11">Team 11</option><option value="12">Team 12</option>
    </select>
    <input id="teamName" maxlength="30" placeholder="Team name (optional)">
    <input id="teamGroup" maxlength="30" placeholder="Group (for example Form 1)">
    <button id="join">Join</button>
  </div>
  <div id="buzzView">
    <div id="status">Waiting</div>
    <button id="buzzButton">BUZZ</button>
    <div id="micStatus">MIC OFF</div>
    <button id="pttButton">HOLD TO SPEAK</button>
    <div id="teamInfo"></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket=io(), $=id=>document.getElementById(id);
    let number=null,name="",group="",myQueueIndex=-1,pressed=false;
    let peer=null, localStream=null, micEnabled=false, pushToTalk=false;
    const saved=JSON.parse(localStorage.getItem("quizTeam")||"null");
    if(saved&&saved.number){$("teamNumber").value=saved.number;$("teamName").value=saved.name||"";$("teamGroup").value=saved.group||"";}
    $("join").onclick=async ()=>{
      number=Number($("teamNumber").value);
      if(!number){alert("Choose a team number");return;}
      name=$("teamName").value.trim();
      group=$("teamGroup").value.trim();
      localStorage.setItem("quizTeam",JSON.stringify({number,name,group}));
      socket.emit("register",{number,name,group});
      await startMicrophonePermission();
    };
    socket.on("registered",team=>{
      number=team.teamNumber;name=team.name||name;group=team.group||group;
      $("setup").style.display="none";$("buzzView").style.display="grid";
      $("teamInfo").textContent=`Team ${number}${name?" — "+name:""}${group?" • "+group:""}`;
    });
    async function startMicrophonePermission(){
      if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        $("micStatus").textContent="Mic unavailable: open the https:// address and accept the certificate warning";
        $("micStatus").className="blocked";
        socket.emit("mic_permission",{state:"unavailable"});
        return;
      }
      try{
        localStream=await navigator.mediaDevices.getUserMedia({
          audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
          video:false
        });
        localStream.getAudioTracks().forEach(track=>track.enabled=false);
        $("micStatus").textContent="Mic ready (off)";
        $("micStatus").className="";
        socket.emit("mic_permission",{state:"granted"});
        await startMicrophone();
      }catch(error){
        if(error&&["NotAllowedError","PermissionDeniedError","SecurityError"].includes(error.name)){
          $("micStatus").textContent="Mic permission denied. Allow the microphone in your browser settings, then refresh";
        }else{
          $("micStatus").textContent="Mic unavailable: open the https:// address and accept the certificate warning";
        }
        $("micStatus").className="blocked";
        socket.emit("mic_permission",{state:error?.name==="NotAllowedError"?"denied":"unavailable"});
      }
    }
    async function startMicrophone(){
      if(!localStream) return;
      try{
        localStream.getAudioTracks().forEach(track=>track.enabled=false);
        peer=new RTCPeerConnection({iceServers:[],iceCandidatePoolSize:0});
        localStream.getTracks().forEach(track=>peer.addTrack(track,localStream));
        peer.onicecandidate=e=>{if(e.candidate)socket.emit("phone_ice",{candidate:e.candidate});};
        peer.onconnectionstatechange=()=>{
          if(peer.connectionState==="failed")$("micStatus").textContent="VOICE CONNECTION FAILED";
        };
        const offer=await peer.createOffer();
        await peer.setLocalDescription(offer);
        socket.emit("phone_offer",{sdp:peer.localDescription});
      }catch(error){
        $("micStatus").textContent="Microphone permission needed";
        $("micStatus").className="blocked";
      }
    }
    socket.on("host_answer",async({sdp})=>{
      if(!peer||!sdp)return;
      await peer.setRemoteDescription(new RTCSessionDescription(sdp));
    });
    socket.on("host_ice",async({candidate})=>{
      if(peer&&candidate)try{await peer.addIceCandidate(new RTCIceCandidate(candidate));}catch(_){}
    });
    socket.on("mic_command",command=>{
      pushToTalk=!!command.pushToTalk;
      micEnabled=!!command.enabled&&!command.blocked;
      localStream?.getAudioTracks().forEach(track=>track.enabled=micEnabled);
      $("pttButton").style.display=pushToTalk?"block":"none";
      if(command.blocked)$("micStatus").textContent="Mic blocked",$("micStatus").className="blocked";
      else if(micEnabled){$("micStatus").textContent="LIVE",$("micStatus").className="live";socket.emit("voice_live",{live:true});}
      else{$("micStatus").textContent=pushToTalk?"HOLD TO SPEAK":"Mic ready (off)",$("micStatus").className="";
        socket.emit("voice_live",{live:false});}
    });
    function setPtt(held){
      if(!pushToTalk)return;
      socket.emit("ptt",{held});
    }
    $("pttButton").addEventListener("pointerdown",e=>{e.preventDefault();setPtt(true);navigator.vibrate&&navigator.vibrate(50);});
    ["pointerup","pointercancel","pointerleave"].forEach(type=>$("pttButton").addEventListener(type,()=>setPtt(false)));
    $("buzzButton").addEventListener("pointerdown",e=>{
      e.preventDefault();
      if(!number||pressed)return;
      pressed=true;
      navigator.vibrate&&navigator.vibrate([70,40,70]);
      socket.emit("buzz");
    });
    document.addEventListener("contextmenu",e=>e.preventDefault());
    socket.on("state",state=>{
      const team=state.teams.find(t=>t.number===number);
      if(team&&team.name)name=team.name;
      const index=state.queue.findIndex(e=>e.number===number);
      myQueueIndex=index;
      const falseStart=state.falseStarts.includes(number);
      if(falseStart){$("status").textContent="Locked out";}
      else if(index===0){$("status").textContent="You are 1st!";}
      else if(index>0){$("status").textContent=`You are ${index+1}${index+1===2?"nd":index+1===3?"rd":"th"} in line`;}
      else if(state.gameState==="open"){$("status").textContent="Buzz now!";}
      else if(state.gameState==="locked"){$("status").textContent="Waiting";}
      else {$("status").textContent="Waiting";}
      pressed=false;
      $("buzzButton").style.opacity=(state.gameState==="open"&&index<0&&!falseStart)?1:.55;
    });
    socket.on("kicked",()=>{localStorage.removeItem("quizTeam");location.reload();});
  </script>
</body>
</html>
