<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Buzzer — Host</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; background:#10131a; color:#fff; }
    button, input { font-size:1.1rem; }
    #startOverlay { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:#10131a; }
    #startButton { width:min(80vw,600px); height:220px; border-radius:24px; border:0; background:#16a34a; color:white; font-size:4rem; font-weight:900; }
    #app { display:none; min-height:100vh; padding:18px; box-sizing:border-box; }
    .top { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start; }
    .active { min-height:180px; border:4px solid #334155; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1c2330; }
    .active.has-team { animation:flash .55s infinite alternate; border-color:#facc15; }
    #activeNumber { font-size:6rem; line-height:.9; font-weight:900; }
    #activeName { font-size:2.2rem; }
    @keyframes flash { from { background:#1c2330; } to { background:#553d00; } }
    .controls button { min-width:140px; min-height:64px; margin:5px; border:0; border-radius:10px; color:white; font-weight:800; }
    #openBtn { background:#2563eb; } #correctBtn { background:#16a34a; } #wrongBtn { background:#dc2626; }
    #resetBtn { background:#475569; } #resetScoresBtn { background:#7c3aed; }
    .settings { margin:10px 0; background:#1c2330; padding:10px; border-radius:10px; }
    .settings label { display:inline-block; margin:4px 12px 4px 0; }
    .settings input { width:75px; padding:6px; }
    .layout { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-top:16px; }
    .panel { background:#1c2330; border-radius:14px; padding:12px; }
    #queue { list-style:none; padding:0; margin:0; }
    #queue li { display:grid; grid-template-columns:70px 90px 1fr 120px; align-items:center; min-height:62px; border-bottom:1px solid #475569; font-size:1.35rem; }
    #queue li:first-child { color:#facc15; font-weight:900; }
    .false { color:#fb923c; }
    #scoreboard { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .team { display:grid; grid-template-columns:55px 1fr auto; align-items:center; background:#111827; border-radius:9px; padding:8px; min-height:55px; }
    .teamNumber { font-size:2.2rem; font-weight:900; }
    .teamScore { font-size:2rem; font-weight:900; }
    .connected { color:#4ade80; } .disconnected { color:#94a3b8; }
    .kick { margin-left:8px; background:#7f1d1d; color:white; border:0; border-radius:6px; padding:8px; }
    #timer { font-size:3rem; text-align:right; color:#facc15; min-width:150px; }
    #qrBox { text-align:center; } #qrBox img { width:180px; height:180px; background:white; }
    #network { font-size:.9rem; color:#cbd5e1; }
    @media(max-width:800px){ .top,.layout{grid-template-columns:1fr}.controls button{min-width:110px}#scoreboard{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="startOverlay"><button id="startButton">START</button></div>
  <main id="app">
    <div class="top">
      <div>
        <div class="active" id="activePanel"><div id="activeNumber">—</div><div id="activeName">Waiting for a press</div></div>
        <div class="controls">
          <button id="openBtn">Open Question</button><button id="correctBtn">Correct</button><button id="wrongBtn">Wrong</button>
          <button id="resetBtn">Reset / Next</button><button id="resetScoresBtn">Reset All Scores</button>
        </div>
      </div>
      <div><div id="timer">10</div><div id="qrBox"><img id="qr" alt="Phone buzzer QR code"><div id="network"></div></div></div>
    </div>
    <div class="settings">
      <label>Correct points <input id="points" type="number" min="0" value="10"></label>
      <label>Wrong subtract <input id="wrongPoints" type="number" min="0" value="0"></label>
      <label>Timer seconds <input id="timerSeconds" type="number" min="0" value="10"></label>
    </div>
    <div class="layout">
      <section class="panel"><h2>Press Queue</h2><ol id="queue"></ol></section>
      <section class="panel"><h2>Scoreboard</h2><div id="scoreboard"></div></section>
    </div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket=io();
    let audioContext=null, state=null, timerHandle=null, remaining=10;
    const $=id=>document.getElementById(id);

    function tone(frequency, duration=.35, volume=.25) {
      if(!audioContext) return;
      const oscillator=audioContext.createOscillator(), gain=audioContext.createGain();
      oscillator.type="sine"; oscillator.frequency.value=frequency;
      gain.gain.setValueAtTime(volume,audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
      oscillator.connect(gain); gain.connect(audioContext.destination);
      oscillator.start(); oscillator.stop(audioContext.currentTime+duration);
    }
    function playTeam(number) {
      const audio=new Audio(`/sounds/team${number}.mp3`);
      let custom=false;
      audio.addEventListener("canplay",()=>{custom=true;audio.play().catch(()=>tone(220+number*55));},{once:true});
      audio.play().catch(()=>{});
      audio.addEventListener("error",()=>tone(220+number*55),{once:true});
    }
    function stopTimer(){clearInterval(timerHandle);timerHandle=null;}
    function startTimer(seconds){stopTimer();remaining=seconds;$("timer").textContent=seconds||"—";if(seconds<=0)return;timerHandle=setInterval(()=>{remaining--; $("timer").textContent=Math.max(0,remaining);if(remaining<=0)stopTimer();},1000);}
    $("startButton").onclick=async()=>{audioContext=new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();$("startOverlay").style.display="none";$("app").style.display="block";};

    function sendConfig(){socket.emit("host_config",{points:+$("points").value,wrongPoints:+$("wrongPoints").value,timerSeconds:+$("timerSeconds").value});}
    ["points","wrongPoints","timerSeconds"].forEach(id=>$(id).onchange=sendConfig);
    $("openBtn").onclick=()=>{sendConfig();socket.emit("host_open");};
    $("correctBtn").onclick=()=>socket.emit("host_correct");
    $("wrongBtn").onclick=()=>socket.emit("host_wrong");
    $("resetBtn").onclick=()=>socket.emit("host_reset");
    $("resetScoresBtn").onclick=()=>{if(confirm("Reset every team score?"))socket.emit("host_reset_scores");};

    document.addEventListener("keydown",e=>{
      if(e.target.matches("input"))return;
      if(e.code==="Space"){e.preventDefault();sendConfig();socket.emit("host_open");}
      if(e.key.toLowerCase()==="c")socket.emit("host_correct");
      if(e.key.toLowerCase()==="w")socket.emit("host_wrong");
      if(e.key.toLowerCase()=="r")socket.emit("host_reset");
    });

    socket.on("state",s=>{
      state=s;
      $("points").value=s.config.points;$("wrongPoints").value=s.config.wrongPoints;$("timerSeconds").value=s.config.timerSeconds;
      const queue=$("queue");queue.innerHTML="";
      s.queue.forEach((entry,index)=>{
        const li=document.createElement("li");
        li.innerHTML=`<b>${index+1}${index===0?"st":index===1?"nd":index===2?"rd":"th"}</b><b>#${entry.number}</b><span>${entry.name||"Team "+entry.number}</span><span>+${entry.gap} ms</span>`;
        queue.appendChild(li);
      });
      s.falseStarts.forEach(number=>{
        const li=document.createElement("li");li.className="false";
        li.innerHTML=`<b>—</b><b>#${number}</b><span>False start</span><span></span>`;queue.appendChild(li);
      });
      const active=s.queue[0];
      $("activePanel").classList.toggle("has-team",!!active);
      $("activeNumber").textContent=active?"#"+active.number:"—";
      $("activeName").textContent=active?(active.name||"Team "+active.number):(s.gameState==="open"?"No presses yet":"Waiting");
      const board=$("scoreboard");board.innerHTML="";
      s.teams.forEach(team=>{
        const div=document.createElement("div");div.className="team";
        div.innerHTML=`<b class="teamNumber">#${team.number}</b><div><div>${team.name||"Unnamed"}</div><small class="${team.connected?"connected":"disconnected"}">${team.connected?"Connected":"Disconnected"}</small></div><div><span class="teamScore">${team.score}</span><button class="kick">Kick</button></div>`;
        div.querySelector(".kick").onclick=()=>socket.emit("host_kick",team.number);board.appendChild(div);
      });
      if(s.gameState==="open"&&!timerHandle) startTimer(s.config.timerSeconds);
      if(s.gameState!=="open") stopTimer();
    });
    socket.on("wrong",({promoted})=>{tone(110,.5,.35);if(promoted)playTeam(promoted);});
    socket.on("time_up",()=>tone(70,1,.4));
    fetch("/qr").then(r=>r.json()).then(data=>{$("qr").src=data.qr;$("network").textContent=data.url;});
  </script>
</body>
</html>
